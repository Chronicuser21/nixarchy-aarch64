name: update

on:
  schedule:
    # Nightly, not weekly. These publish often -- hey-cli moved to 1.4.1 while
    # the 2026-09-05 nightly review watched a weekly job that would not look
    # again until Monday. A bump that waits six days for its cron is stale on
    # arrival.
    #
    # The comment that stood here said the nixpkgs-sourced apps "need nothing
    # here -- they follow whatever nixpkgs a user's own `nix flake update`
    # pulls". They follow the pin this repo commits, and nothing updated it:
    # on 2026-09-05 that pin was twelve days old, and claude-code, codex,
    # opencode, ollama and zed-editor were each several versions behind what
    # nixpkgs already had ready. flake-update.yml now moves the pin nightly;
    # this job keeps its own scope, the packages pinned here by version and
    # hash.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
      - uses: cachix/cachix-action@v17
        # A cache upload failing must not fail a build that succeeded (#235).
        continue-on-error: true
        with:
          name: nixarchy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Bump pinned packages
        id: bump
        run: |
          nix run .#update
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nothing to bump"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Build every bumped package
        if: steps.bump.outputs.changed == 'true'
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          # A stale hash left behind by a broken rewrite fails here rather than
          # in a user's rebuild. The updater refuses to bump a version without
          # its hashes, but this is the check that actually proves it.
          #
          # Derived from the same set the updater ran, not named by hand: the
          # old list here was `.#once .#grok-bot`, which built a package this
          # job could never change (grok-bot has no updateScript) and skipped
          # one it could (hey-cli). Building every covered package rather than
          # only what changed is deliberate -- the set is two small binary
          # repacks, and it avoids trusting a filename-to-attribute convention
          # nothing enforces.
          mapfile -t attrs < <(nix eval --json .#update.pinned | jq -r '.[] | ".#" + .')

          # mapfile returns 0 whatever the process substitution did -- a failed
          # eval, a renamed output, a jq that is not there -- and an empty
          # array then makes the line below `nix build --impure
          # --print-build-logs` with no installables, which builds .#default
          # and exits GREEN. The one step that proves the rewritten packages
          # still build would have built none of them and said nothing.
          #
          # Six is what .#update.pinned holds today (hey-cli, omacalc, omacut,
          # omawrite, once, ttfx). The floor is 1 rather than 6 so removing a
          # package from the set is an ordinary edit and not a CI break, while
          # "the list came back empty" still stops the job.
          if [ "${#attrs[@]}" -eq 0 ]; then
            echo "::error::.#update.pinned produced no attributes, so this step" \
                 "would build .#default and pass without checking the packages" \
                 "the bump just rewrote" >&2
            exit 1
          fi

          echo "building: ${attrs[*]}"
          nix build --impure --print-build-logs "${attrs[@]}"

      - name: Open a pull request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # The default token, always. This used to be BUMP_TOKEN so the PR
          # would trigger build.yml; the secret kept being rejected on the
          # push with a 403 ("Permission ... denied to Chronicuser21"), and a
          # defined-but-broken secret always beats the `|| github.token`
          # fallback below it. The default token opens the PR every time, and
          # it cannot trigger workflows on that PR -- said in the body, not
          # hidden -- so the checks have to be started from the Actions tab.
          token: ${{ github.token }}
          branch: update/pinned-packages
          title: "Bump pinned packages"
          commit-message: |
            Bump pinned packages

            Generated by .github/workflows/update.yml.
          body: |
            Automated version and hash bumps for the packages this repo pins
            by hand. Apps that come from nixpkgs are not touched: they follow
            whatever nixpkgs a user's own `nix flake update` resolves.

            Every package here built in the job that opened this pull
            request. A PR opened by the default GITHUB_TOKEN runs no CI of
            its own, so start this workflow from the Actions tab on the
            pull request branch -- then merge by hand.

            **A build is not proof the app still works.** Two of these are
            proprietary Electron bundles that can compile fine and crash at
            launch, so this is deliberately not auto-merged — please launch
            anything that changed before merging.
          labels: dependencies
          delete-branch: true
